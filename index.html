يباً كل عامين"؟',a:"قانون مور (Moore's Law)"}],terms:{q:"حدد المصطلحات:",items:[{q:"ما المصطلح الذي يشير إلى بيع السلع والخدمات وشرائها عبر الإنترنت؟",a:"التجارة الإلكترونية"},{q:"ما المصطلح الذي يصف أداء الشخص عمله من المنزل أو من موقع بعيد عبر الإنترنت؟",a:"العمل عن بُعد"},{q:"ما المصطلح الذي يشير إلى نظام إجراء المدفوعات بالنقود الإلكترونية ورموز QR وغيرها، دون استخدام النقد؟",a:"الدفع غير النقدي"},{q:"ما المصطلح الذي يشير إلى التقنية التي تستخدم الذكاء الاصطناعي لقيادة مركبة بأقل تدخل بشري بحسب مستوى الأتمتة؟",a:"القيادة الذاتية"}]},essays:[{id:"1-1-e1",q:"اشرح تطور تكنولوجيا المعلومات في الفترة الممتدة من الأربعينيات إلى الستينيات موضحاً استخدامها الأساسي في تلك الفترة.",model:"ظهرت الحواسيب الإلكترونية في أربعينيات القرن العشرين، وكان استخدامها الأساسي مقتصراً على الأغراض العسكرية والحسابات العلمية لدى المؤسسات والجهات الحكومية."},{id:"1-1-e2",q:"اشرح «قانون مور» موضحاً ما يصفه، والتحديات الهندسية والفيزيائية التي تواجه استمرار تصغير مكونات الدوائر.",model:'يصف قانون مور الاتجاه التاريخي الذي ينص على أن "عدد الترانزستورات في الدائرة المتكاملة يتضاعف تقريباً كل عامين". وتواجه استمرار هذا التصغير تحديات هندسية وفيزيائية مثل تيارات التسرب والتأثيرات الكمومية التي تُبطئ هذا الاتجاه.'},{id:"1-1-e3",q:"عدّد التحولات المجتمعية الخمسة الناتجة عن تكنولوجيا المعلومات، موضحاً مفهوم كل من «العمل عن بعد» و«التجارة الإلكترونية».",model:"التحولات الخمسة: شبكات التواصل الاجتماعي (SNS)، التجارة الإلكترونية، العمل عن بُعد، التعلم عبر الإنترنت، والدفع غير النقدي. العمل عن بعد: أداء الشخص لعمله من المنزل أو من موقع بعيد آخر عبر الإنترنت. التجارة الإلكترونية: بيع السلع والخدمات وشراؤها عبر الإنترنت."}],mcqs:[{id:"1-1-m1",q:"ما هي الملاحظة التجريبية التي تصف اتجاهاً تاريخياً لازدياد عدد الترانزستورات في الدوائر المتكاملة بمعدل يقارب الضعف كل عامين؟",options:["الحوسبة السحابية","قانون مور","الحوسبة الطرفية","التراكب الكمي"],correct:1,explain:"قانون مور هو التفسير الدقيق المذكور في الكتاب."},{id:"1-1-m2",q:"ما المقصود بمصطلح «الدفع غير النقدي (Cashless Payment)»؟",options:["دفع نقدي يدوي فقط","دفع قيمة السلع أو الخدمات بوسائل غير نقدية مثل البطاقات أو تطبيقات الهاتف أو رموز QR","تحويل الأموال عبر البريد فقط","مقايضة السلع"],correct:1,explain:"التعريف النموذجي المباشر من متن المصدر."},{id:"1-1-m3",q:"التقنية التي تضيف عناصر أو معلومات رقمية فوق مشهد من العالم الحقيقي تُعرف باسم:",options:["الواقع الافتراضي (VR)","القيادة الذاتية","الواقع المعزز (AR)","الحوسبة الكمومية"],correct:2,explain:"AR هو إضافة عناصر رقمية فوق الواقع الحقيقي."},{id:"1-1-m4",q:"في أي فترة زمنية أُتيح الإنترنت للاستخدام التجاري وظهر الويب مما توسع معه الوصول العالمي إلى المعلومات؟",options:["الأربعينيات والستينيات","التسعينيات","السبعينيات والثمانينيات","من العقد الثاني من الألفية"],correct:1,explain:"التسعينيات هي فترة الإتاحة التجارية للإنترنت."}]},{id:"1-2",title:"كيف يعمل الذكاء الاصطناعي",badge:"الدرس 1-2",icon:dr,concepts:[{name:"AI",def:"المصطلح العام للأنظمة الحاسوبية القادرة على أداء مهام مثل التعلم والتعرف والتنبؤ وتوليد المحتوى واتخاذ القرارات."},{name:"ML التعلم الآلي",def:"فرع من الذكاء الاصطناعي تتعلم فيه النماذج أنماطاً من البيانات بدلاً من البرمجة الصريحة للقواعد."},{name:"DL التعلم العميق",def:"أسلوب من أساليب التعلم الآلي يعتمد على شبكات عصبية اصطناعية متعددة الطبقات لتعلم تمثيلات وأنماط معقدة."},{name:"GenAI التوليدي",def:"أنظمة الذكاء الاصطناعي التي تنشئ محتوى جديداً ومبتكراً كالنصوص والصور والأصوات والبرمجيات."},{name:"طبقة الإدخال",def:"أولى مكونات الشبكة العصبية الاصطناعية، تستقبل البيانات الخام."},{name:"الطبقات المخفية",def:"طبقات وسيطة بين الإدخال والإخراج، يتم فيها تغيير الأوزان أثناء التدريب لتعلم الأنماط."},{name:"طبقة الإخراج",def:"الطبقة النهائية التي تُنتج نتيجة التنبؤ أو التصنيف أو التوليد."},{name:"الهلوسة",def:"ظاهرة إنتاج الذكاء الاصطناعي التوليدي لنص يبدو معقولاً ولكنه غير صحيح واقعياً ومضلل."},{name:"Narrow AI",def:"معظم أنظمة الذكاء الحالية مصممة لأداء مهمة محددة أو مجموعة محدودة من المهام - ضيق النطاق."},{name:"مرشحات الرسائل المزعجة",def:"مثال مباشر على تطبيقات التعلم الآلي: تصفية السبام وتوصيات المنتجات."}],objectives:["تمييز مستويات الذكاء: AI كمظلة عامة، ML كتعلم أنماط من البيانات، DL كشبكات عميقة متعددة الطبقات، GenAI كتوليد محتوى جديد.","فهم مكونات الشبكة العصبية وآلية تغير الأوزان بين العصبونات أثناء التدريب.","إدراك مخاطر الهلوسة وحدود الذكاء الاصطناعي في الأحكام الأخلاقية والخصوصية والمسؤولية."],studentQs:[{q:"ما المصطلح العام للأنظمة الحاسوبية القادرة على أداء مهام مثل التعلم والتعرف والتنبؤ وتوليد المحتوى؟",a:"الذكاء الاصطناعي (AI)"},{q:"ما المصطلح الذي يصف فرع الذكاء الاصطناعي الذي تتعلم فيه النماذج أنماطاً من البيانات؟",a:"التعلم الآلي (Machine Learning - ML)"},{q:"ما المصطلح الذي يصف أسلوب التعلم الآلي المعتمد على شبكات عصبية متعددة الطبقات؟",a:"التعلم العميق (Deep Learning - DL)"},{q:"ما المصطلح الذي يصف أنظمة الذكاء الاصطناعي التي تنشئ محتوى جديداً؟",a:"الذكاء الاصطناعي التوليدي (Generative AI – GenAI)"},{q:'يمكن للذكاء الاصطناعي التوليدي إنتاج نص يبدو معقولاً ولكنه غير صحيح واقعياً ("هلوسة"). اشرح لماذا من الخطر استخدام هذا الناتج كإجابة لتقرير مدرسي كما هو، واذكر ما الذي يجب فعله للتحقق.',a:"الخطر يكمن في إمكانية تضليل الطالب ونقل معلومات غير صحيحة واقعياً في التقرير المدرسي. والواجب فعله هو التحقق من مخرجات الذكاء الاصطناعي ومقارنتها بالحقائق والمصادر الموثوقة قبل الاعتماد عليها."},{q:"حلّل لماذا يناسب الذكاء الاصطناعي بعض المهام بينما يتطلب الحذر في مهام أخرى؟",a:"يبرع الذكاء الاصطناعي في المهام التي تعتمد على إيجاد الأنماط، والتعرف على الصور والصوت والنصوص، والتنبؤ والاستدلال الاحتمالي بناءً على البيانات. بينما يتطلب الحذر الشديد في المهام التي تشمل الأحكام الأخلاقية، وحماية الخصوصية، واتخاذ القرارات النهائية التي تتطلب تحمل المسؤولية."}],essays:[{id:"1-2-e1",q:"عرّف مفهوم الذكاء الاصطناعي، موضحاً في ثلاث نقاط الفرق بين التعلم الآلي والتعلم العميق والذكاء الاصطناعي التوليدي.",model:"الذكاء الاصطناعي (AI): مجال يضم أنظمة حاسوبية تستطيع تنفيذ مهام مثل التعلم من البيانات والتنبؤ والتعرف وتوليد المحتوى واتخاذ القرارات أو دعمها. الفروق: 1) التعلم الآلي (ML): فرع تتعلم فيه النماذج أنماطاً من البيانات بدلاً من البرمجة الصريحة. 2) التعلم العميق (DL): أسلوب من ML يعتمد على شبكات عصبية متعددة الطبقات لتعلم تمثيلات معقدة. 3) GenAI: أحد تطبيقات DL التي تنشئ وتولد محتوى جديداً كالنصوص والصور والأصوات."},{id:"1-2-e2",q:"ما المكونات الأساسية للشبكة العصبية الاصطناعية؟",model:"تتكون من طبقة الإدخال (Input Layer)، الطبقات المخفية (Hidden Layers)، وطبقة الإخراج (Output Layer) مع وجود ترابط بين العصبونات وتغير أوزانها أثناء التدريب."},{id:"1-2-e3",q:"ناقش مشكلة «الهلوسة» في الذكاء الاصطناعي التوليدي، موضحاً سبب خطورتها والإجراء المناسب للتحقق من المخرجات.",model:"الهلوسة: إنتاج الذكاء الاصطناعي التوليدي لنصوص تبدو معقولة ومقنعة ظاهرياً ولكنها غير صحيحة واقعياً. سبب خطورتها: تؤدي إلى الاعتماد على معلومات خاطئة ومضللة في التقارير والواجبات المدرسية. الإجراء المناسب: التحقق الدائم من المخرجات ومقارنتها بالحقائق والمصادر العلمية الموثوقة وعدم الاعتماد المطلق عليها."}],mcqs:[{id:"1-2-m1",q:"ما هو المصطلح الذي يصف أسلوباً من أساليب التعلم الآلي يعتمد على شبكات عصبية متعددة الطبقات لتعلم تمثيلات وأنماط معقدة؟",options:["التعلم الآلي","الذكاء الاصطناعي التوليدي","التعلم العميق","البرمجة التقليدية"],correct:2,explain:"التعلم العميق هو المعتمد على شبكات متعددة الطبقات."},{id:"1-2-m2",q:"ما هي الوظيفة الأساسية لأنظمة «الذكاء الاصطناعي التوليدي»؟",options:["حفظ البيانات فقط","إنشاء محتوى جديد مثل النصوص والصور والصوت والبرمجيات","تشغيل الحاسوب بدون كهرباء","حذف البيانات"],correct:1,explain:"GenAI ينشئ محتوى جديداً مبتكراً."},{id:"1-2-m3",q:"عندما يُنتج الذكاء الاصطناعي التوليدي نصاً يبدو معقولاً ولكن غير صحيح واقعياً، تُسمى هذه الظاهرة بـ:",options:["الهلوسة","التراكب الكمي","الحوسبة الطرفية","التشغيل الخطى"],correct:0,explain:"ظاهرة الهلوسة هي إنتاج نص معقول ظاهرياً غير صحيح واقعياً."},{id:"1-2-m4",q:"معظم أنظمة الذكاء الاصطناعي الحالية تُصمم لأداء مهمة محددة أو مجموعة محدودة من المهام، وتُعرف بـ:",options:["مهمة محددة أو مجموعة محدودة من المهام (ضيق النطاق - Narrow AI)","ذكاء عام خارق","ذكاء بلا حدود","وعي ذاتي"],correct:0,explain:"Narrow AI هو المصطلح الدقيق."},{id:"1-2-m5",q:"أي من الخيارات التالية يُعد مثالاً مباشراً على تطبيقات «التعلم الآلي»؟",options:["مرشحات الرسائل المزعجة وتوصيات المنتجات","آلة كاتبة يدوية","مصباح كهربائي","قلم رصاص"],correct:0,explain:"مرشحات السبام وتوصيات المنتجات هي ML تطبيقي."}]},{id:"1-3",title:"الذكاء الاصطناعي في الحياة اليومية والصناعة",badge:"الدرس 1-3",icon:Ge,concepts:[{name:"نظام التوصية",def:"نظام يتنبأ بالتفضيلات من بيانات السلوك السابق ويعرض مقاطع/منتجات ملائمة مثل توصيات الفيديو."},{name:"المساعد الصوتي",def:"نظام يتعرف على الصوت ويفهم الأوامر وينفذها مثل Siri ومساعد جوجل."},{name:"الترجمة الآلية",def:"تقنية تحول نصاً بلغة أجنبية إلى اللغة الأم فورياً."},{name:"التعرف على الوجه",def:"تقنية ذكاء اصطناعي للتعرف على الهوية من ملامح الوجه."},{name:"التشخيص بالصور",def:"استخدام الذكاء الاصطناعي والتعلم العميق في تحليل الصور الطبية مثل الأشعة والتصوير المقطعي للكشف المبكر عن الأمراض."},{name:"الصيانة التنبؤية",def:"استخدام البيانات للتنبؤ بأعطال الآلات أو المعدات قبل وقوعها في التصنيع."},{name:"الخدمات اللوجستية",def:"قطاع يتم فيه تحسين مسارات التوصيل وإدارة حركة أسطول النقل بالذكاء الاصطناعي."},{name:"الزراعة الذكية",def:"التنبؤ بموعد الحصاد والكشف عن الآفات والأمراض ومراقبة المحاصيل."},{name:"الصندوق الأسود",def:"عدم الوضوح وغموض كيفية توصل الذكاء الاصطناعي إلى حكمه أو قراره."},{name:"الهلوسة",def:"إنتاج نص مقنع غير صحيح واقعياً ويحتاج تحقق دائم."}],objectives:["ربط تطبيقات يومية: توصية الفيديو من سلوك سابق، مساعد صوتي يفهم الأوامر، ترجمة آلية فورية.","تحليل قطاعات صناعية: رعاية صحية (تشخيص صور)، تصنيع (فحص جودة + صيانة تنبؤية)، زراعة (حصاد/آفات)، لوجستيات (مسارات).","تمييز ما يبرع فيه AI (سرعة معالجة كميات ضخمة، تصنيف أنماط، تعرف صور/صوت/نص) وما يتطلب حذر (أخلاق، خصوصية، قرار نهائي بإشراف بشري)."],fill:{q:"يُستخدم الذكاء الاصطناعي على نطاق واسع في حياتنا اليومية. املأ الفراغات:",blanks:["توصيات مقاطع الفيديو التي تناسب تفضيلات المرء على موقع فيديو تأتي من نظام ( 1 ) ______.","تُستخدم تقنية الذكاء الاصطناعي في ( 2 ) ______، والتي يمكن للمرء من خلالها التحدث إلى هاتف ذكي لتشغيله.","تُستخدم تقنية الذكاء الاصطناعي في ( 3 ) ______، التي تحول نصاً بلغة أجنبية إلى اللغة الأم."],answers:["التوصية (Recommendation System)","المساعد الصوتي (Voice Assistant)","الترجمة الآلية (Machine Translation)"]},simples:[{q:"في أي صناعة تُستخدم أنظمة الذكاء الاصطناعي للتشخيص بالصور؟",a:"الرعاية الصحية (Healthcare)"},{q:"في التصنيع، ما المصطلح الذي يصف استخدام البيانات للتنبؤ بأعطال الآلات أو المعدات قبل وقوعها؟",a:"الصيانة التنبؤية (Predictive Maintenance)"},{q:"حلّل ما يبرع فيه الذكاء الاصطناعي وما يتطلب الحذر عند استخدامه في الحياة اليومية والصناعة؟",a:"ما يبرع فيه: المعالجة عالية السرعة لكميات كبيرة من البيانات، وإيجاد الأنماط وتصنيفها، والتعرف على الصور والصوت والنصوص، والاستدلال الاحتمالي. ما يتطلب الحذر: الأحكام الأخلاقية، والأحكام التي تشمل المعلومات الشخصية والخصوصية، واتخاذ القرار النهائي الذي يتطلب إشرافاً ومراجعة بشرية."}],essays:[{id:"1-3-e1",q:"اشرح كيف أصبحت تقنيات مثل منصات الفيديو والمساعدات الصوتية جزءاً من الخدمات اليومية، وما هو الدور الأساسي للذكاء الاصطناعي فيها؟",model:"تعتمد منصات الفيديو على أنظمة التوصية التي تتنبأ بالتفضيلات من بيانات السلوك السابق وتفرض مقاطع ملائمة، بينما تعتمد المساعدات الصوتية على التعرف على الصوت وفهم الأوامر الشفهية وتنسيق تنفيذها، وتعمل الترجمة الآلية على تحويل النصوص فورياً بين اللغات."},{id:"1-3-e2",q:"وضح المقصود بـ «الذكاء الاصطناعي للتشخيص بالصور» في مجال الرعاية الصحية، وكيف يسهم في الكشف عن الأمراض؟",model:"هو استخدام الذكاء الاصطناعي والتعلم العميق في معالجة البيانات المعقدة وتحليل الصور الطبية مثل صور الأشعة السينية والتصوير المقطعي للكشف المبكر عن الأمراض والورم بدقة تماثل أو تدعم الفحص الطبي البشري."},{id:"1-3-e3",q:"اذكر أربعة قطاعات صناعية رئيسية يتم فيها إدخال تقنيات الذكاء الاصطناعي مع بيان دور كل قطاع باختصار؟",model:"1) الرعاية الصحية: تحليل الصور الطبية واكتشاف الأدوية. 2) الزراعة: التنبؤ بموعد الحصاد والكشف عن الآفات والأمراض ومراقبة المحاصيل. 3) التصنيع: فحص جودة المنتج والصيانة التنبؤية للآلات قبل عطلها. 4) الخدمات اللوجستية: تحسين مسارات التوصيل وإدارة حركة أسطول النقل."},{id:"1-3-e4",q:"ما الأبعاد المتعلقة بمشكلة «الصندوق الأسود» في تطبيقات الذكاء الاصطناعي؟",model:"تعبر مشكلة الصندوق الأسود عن عدم ا
